name: build

on:
  push:
    branches: [main, "i18n/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK e ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          SDK_ROOT="/usr/lib/android-sdk"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;35.0.0" "platform-tools"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Preparar ambiente
        run: |
          python3 --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f app/AndroidManifest.xml
          test -d app/smali
          test -d app/res
          test -f runtime/classes2.dex
          test -f tools/apktool.jar

      - name: Compilar APK
        run: |
          chmod +x build.sh
          ANDROID_HOME="$ANDROID_HOME" ./build.sh

      - name: Validar APK e assinatura
        run: |
          set -euo pipefail
          APK=build/FakaniVM.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'classes2.dex'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee build/FakaniVM.apk.sha256
          ls -lh "$APK"

      - name: Enviar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: FakaniVM-pt-BR
          path: |
            build/FakaniVM.apk
            build/FakaniVM.apk.sha256
          if-no-files-found: error
          retention-days: 30
